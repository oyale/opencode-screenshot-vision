name: Node.js CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: |
          # Try a reproducible `npm ci` first; if it fails for any reason,
          # fall back to `npm install` so the job doesn't abort on lockfile
          # mismatches or platform-specific optional dependencies.
          echo "Attempting npm ci; falling back to npm install on failure"
          if npm ci; then
            echo "npm ci succeeded"
          else
            echo "npm ci failed — running npm install instead"
            npm install
          fi

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: |
          # The test script uses `bun test`. Bun is available in the Bun CI workflow,
          # but not guaranteed on Node.js runners. Only run tests if `bun` is present;
          # otherwise skip tests to avoid failing Node.js matrix jobs.
          if command -v bun >/dev/null 2>&1; then
            npm test --if-present
          else
            echo "bun not found — skipping tests on Node.js runner"
          fi

      - name: Lint
        run: npm run lint --if-present
