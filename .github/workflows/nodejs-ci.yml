name: Node.js CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 24]

    steps:
      - uses: actions/checkout@v7
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: |
          # Try a reproducible `npm ci` first; if it fails for any reason,
          # fall back to `npm install` so the job doesn't abort on lockfile
          # mismatches or platform-specific optional dependencies.
          echo "Running npm ci || npm install"
          npm ci || npm install

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm test --if-present

      - name: Lint
        run: npm run lint --if-present
