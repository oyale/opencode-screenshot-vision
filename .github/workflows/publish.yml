name: Publish package

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          registry-url: 'https://registry.npmjs.org'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build --if-present

      - name: Publish to npm (OIDC / Trusted Publisher or fallback to NPM token)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Using NPM_TOKEN secret as fallback for publish"
            echo "//registry.npmjs.org/:_authToken=$NODE_AUTH_TOKEN" > ~/.npmrc
            npm publish --provenance --access public
          else
            echo "No NPM_TOKEN found; using OIDC Trusted Publisher (ensure it's configured in npmjs.com)"
            npm publish --provenance --access public
          fi
